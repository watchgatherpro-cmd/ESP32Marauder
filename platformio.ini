[platformio]
src_dir = esp32_marauder
test_dir = test

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = true
extra_scripts =
  pre:tools/native_coverage.py
build_src_filter =
  -<*>
  +<MarauderMacAddress.cpp>
  +<PcapHeader.cpp>
  +<Switches.cpp>
  +<DisplayLine.cpp>
  +<BeaconFrame.cpp>
  +<WdgResponse.cpp>
  +<FoxHuntTarget.cpp>
  +<TargetListSort.cpp>
  +<TDongleStats.cpp>
  +<IPv4Range.cpp>
  +<FirmwareMetadata.cpp>
  +<MenuMarquee.cpp>
  +<GpsTrackerStats.cpp>
  +<BootSplash.cpp>
  +<MenuInputRepeat.cpp>
  +<TDongleBus.cpp>
  +<RemoteIdModel.cpp>
  +<RemoteIdDecoder.cpp>
  +<MemoryGuard.cpp>
  +<CsiMotionModel.cpp>
  +<CensorText.cpp>
  +<StationSelection.cpp>
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wpedantic
  --coverage
  -Itest/support


[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMARAUDER_MULTIBOARD_S3
lib_deps = 
    https://github.com/justcallmekoko/ArduinoJson.git
    https://github.com/justcallmekoko/ESPAsyncWebServer.git
    https://github.com/justcallmekoko/AsyncTCP.git
    https://github.com/h2zero/NimBLE-Arduino.git
    bodmer/TFT_eSPI@^2.5.43
